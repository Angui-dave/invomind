services:
  postgres:
    image: postgres:16-alpine
    container_name: invomind-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invomind
    volumes:
      - invomind_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invomind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invomind_pgdata:
